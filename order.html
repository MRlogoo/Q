<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم سفارش طراحی وب‌سایت | MR LOGO</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #007bff;
      --secondary: #17a2b8;
      --bg-light: #f8f9fa;
      --text-dark: #333;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      margin: 0;
      background-color: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.8;
    }

    header {
      background-color: #212529;
      color: white;
      text-align: center;
      padding: 25px 0;
      font-size: 1.7em;
      font-weight: 900;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 0;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 10px;
    }

    p.sub {
      text-align: center;
      color: #666;
      margin-bottom: 40px;
    }

    form {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: 600;
      color: #444;
      margin-bottom: 5px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      outline: none;
    }

    textarea { resize: vertical; min-height: 100px; }

    button {
      background-color: var(--primary);
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover { background-color: #0056b3; }

    .success-message {
      display: none;
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      background-color: #212529;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
      font-size: 0.9em;
    }

    @media(max-width:600px) {
      form { padding: 25px 20px; }
    }
  </style>
</head>
<body>

  <header>سفارش طراحی وب‌سایت</header>

  <div class="container">
    <h1>درخواست پروژه جدید</h1>
    <p class="sub">فرم زیر را تکمیل کنید تا در سریع‌ترین زمان با شما تماس بگیریم</p>

    <form id="orderForm">
      <div>
        <label for="name">نام و نام خانوادگی</label>
        <input type="text" id="name" name="name" placeholder="مثلاً: علی رضایی" required>
      </div>

      <div>
        <label for="email">ایمیل</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div>
        <label for="phone">شماره تماس</label>
        <input type="tel" id="phone" name="phone" placeholder="0912xxxxxxx" required>
      </div>

      <div>
        <label for="type">نوع وب‌سایت مورد نظر</label>
        <select id="type" name="type" required>
          <option value="">انتخاب کنید...</option>
          <option>وب‌سایت شخصی</option>
          <option>وب‌سایت شرکتی</option>
          <option>فروشگاه اینترنتی</option>
          <option>پورتفولیو طراحی/خلاقیت</option>
          <option>سرویس یا استارتاپ آنلاین</option>
        </select>
      </div>

      <div>
        <label for="budget">محدوده بودجه</label>
        <select id="budget" name="budget" required>
          <option value="">انتخاب کنید...</option>
          <option>زیر ۵ میلیون تومان</option>
          <option>۵ تا ۱۵ میلیون تومان</option>
          <option>۱۵ تا ۳۰ میلیون تومان</option>
          <option>بیش از ۳۰ میلیون تومان</option>
        </select>
      </div>

      <div>
        <label for="desc">توضیحات پروژه</label>
        <textarea id="desc" name="desc" placeholder="جزئیات پروژه، اهداف، ویژگی‌های مورد نظر..." required></textarea>
      </div>

      <button type="submit">ارسال سفارش</button>

      <div class="success-message" id="successMessage">
        🎉 سفارش شما با موفقیت ثبت شد!  
        تیم ما به‌زودی با شما تماس خواهد گرفت.
      </div>
    </form>
  </div>

  <footer>
    © 2025 MR LOGO — تمامی حقوق محفوظ است.
  </footer>

  <script>
    document.getElementById("orderForm").addEventListener("submit", function(e){
      e.preventDefault();
      const form = this;
      form.reset();
      document.getElementById("successMessage").style.display = "block";
      window.scrollTo({ top: form.offsetTop, behavior: "smooth" });
    });
  </script>

</body>
</html>
